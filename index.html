<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#090806" />
    <meta name="description" content="Lecturas bíblicas en lector rápido." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css?v=10" />
    <title>Mis Lecturas Bíblicas</title>
  </head>
  <body>
    <main class="app-shell">
      <section class="library-view" id="library-view" aria-labelledby="library-title">
        <header class="hero">
          <span class="eyebrow">LECTURA PERSONAL</span>
          <h1 id="library-title">Mis Lecturas<br /><em>Bíblicas</em></h1>
          <p>Elige una lectura para comenzar.</p>
          <label class="version-picker" for="version-select">
            <span>Versión bíblica</span>
            <select id="version-select" aria-label="Seleccionar versión bíblica">
              <option value="vbl">Versión Biblia Libre · VBL</option>
              <option value="pddpt">Palabra de Dios para ti · PdDpt</option>
              <option value="rvr1960">Reina-Valera 1960 · RVR1960</option>
            </select>
          </label>
          <p class="version-credit" id="version-credit"></p>
        </header>

        <div class="library-status" id="library-status" aria-live="polite"></div>
        <div class="reading-grid" id="reading-grid" aria-label="Las catorce lecturas bíblicas"></div>
      </section>

      <section class="reader-view is-hidden" id="reader-view" aria-labelledby="reader-title">
        <header class="reader-header">
          <button class="text-button" id="back-button" type="button" aria-label="Volver a las lecturas">← Lecturas</button>
          <p class="reader-book" id="reader-title"></p>
          <button class="icon-button" id="fullscreen-button" type="button" aria-label="Abrir pantalla completa" title="Pantalla completa">⛶</button>
        </header>

        <div class="reader-stage">
          <div class="focus-line" aria-hidden="true"></div>
          <p class="word-display" id="word-display" aria-live="polite">Preparado</p>
        </div>

        <section class="controls" aria-label="Controles de lectura">
          <label class="progress-control" for="progress-input">
            <span id="progress-label">0 % leído</span>
            <input id="progress-input" type="range" min="0" max="0" value="0" step="1" aria-label="Posición de lectura" />
            <span id="word-count">0 / 0</span>
          </label>

          <div class="transport">
            <button class="round-button secondary" id="back-word-button" type="button" aria-label="Retroceder diez palabras">↶<small>10</small></button>
            <button class="round-button secondary" id="slower-button" type="button" aria-label="Disminuir velocidad">−<small>PPM</small></button>
            <button class="play-button" id="play-button" type="button" aria-label="Reproducir">▶</button>
            <button class="round-button secondary" id="faster-button" type="button" aria-label="Aumentar velocidad">+<small>PPM</small></button>
            <button class="round-button secondary font-button" id="smaller-font-button" type="button" aria-label="Reducir tamaño de letra">A<small>−</small></button>
            <button class="round-button secondary font-button" id="larger-font-button" type="button" aria-label="Aumentar tamaño de letra">A<small>+</small></button>
          </div>

          <p class="speed" id="speed-label" aria-live="polite">250 palabras por minuto<br />Tiempo restante: —</p>
          <p class="font-size-indicator" aria-live="polite">Tamaño de letra: <output id="font-size-label">10</output> / 20</p>
        </section>
      </section>
    </main>
    <noscript>Esta página necesita JavaScript para mostrar el lector rápido.</noscript>
    <script type="module" src="./app.js?v=10"></script>
  </body>
</html>
